{% extends "base.html" %} {% block content %}
<main class="container py-5">
  <div class="col-md-7 mx-auto">
    <form method="post" enctype="multipart/form-data" class="card card-body">
      {% csrf_token %}
      <h1>Entregar actividad</h1>
      <h2 class="h4">{{ task.title }}</h2>
      <p>{{ task.description }}</p>
      <p>Fecha límite: {{ task.due_date|date:"d/m/Y H:i" }}</p>
      {{ form.non_field_errors }} {{ form.as_p }}

      <!-- Contenedor de vista previa de la imagen -->
      <div id="imagePreview" style="display: none; margin-top: 15px;">
        <!-- Miniatura con atributos para abrir el modal -->
        <img id="submissionPreviewThumbnail" src="" alt="Vista previa de tu entrega" 
             class="img-thumbnail shadow-sm object-fit-cover mt-2 mb-2" 
             style="max-width: 250px; height: 150px; cursor: pointer; transition: 0.3s;" 
             role="button"
             tabindex="0">
        <p class="text-muted small">Haz clic en tu imagen para ampliarla</p>
      </div>

      <button class="btn btn-success">Enviar actividad</button>
    </form>

    <!-- Modal de Bootstrap para vista del estudiante -->
    <div class="modal fade" id="previewModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content bg-transparent border-0">
          <div class="modal-header border-0 pb-0 justify-content-end">
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body text-center pt-0">
            <img id="previewModalImage" src="" class="img-fluid rounded shadow" style="max-height: 85vh;" alt="Vista completa de tu entrega">
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const fileInput = document.querySelector('input[type="file"]');
      const preview = document.getElementById("imagePreview");
      const thumbnail = document.getElementById("submissionPreviewThumbnail");
      const modalImage = document.getElementById("previewModalImage");
      const modalElement = document.getElementById("previewModal");
      const modal = bootstrap.Modal.getOrCreateInstance(modalElement);
      let objectUrl = null;

      if (fileInput && preview && thumbnail && modalImage) {
        function openPreviewModal() {
          if (!thumbnail.getAttribute("src")) {
            return;
          }
          modalImage.src = thumbnail.src;
          modalImage.alt = thumbnail.alt;
          modal.show();
        }

        thumbnail.addEventListener("click", openPreviewModal);
        thumbnail.addEventListener("keydown", function (event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openPreviewModal();
          }
        });

        fileInput.addEventListener("change", function (e) {
          const file = e.target.files[0];
          if (objectUrl) {
            URL.revokeObjectURL(objectUrl);
            objectUrl = null;
          }

          if (file && file.type.startsWith("image/")) {
            objectUrl = URL.createObjectURL(file);
            preview.style.display = "block";
            thumbnail.src = objectUrl;
            modalImage.src = objectUrl;
            thumbnail.alt = "Vista previa de " + file.name;
            modalImage.alt = "Vista completa de tu entrega";
          } else {
            preview.style.display = "none";
            thumbnail.removeAttribute("src");
            modalImage.removeAttribute("src");
          }
        });

        window.addEventListener("pagehide", function () {
          if (objectUrl) {
            URL.revokeObjectURL(objectUrl);
          }
        });
      }
    });
  </script>
{% endblock %}
